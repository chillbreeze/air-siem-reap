        <div class="container">
            <header>
                <h1><a href="/">Air Quality Monitor</a></h1>
                <span class="location">Siem Reap, Cambodia</span>
            </header>
            <nav>
                <a href="/" class="nav-link">Home</a>
                <a href="/faq/" class="nav-link">FAQ</a>

                    id="theme-toggle"
                    aria-label="Toggle theme"
                    type="button"
                >
                    <svg

                        viewBox="0 0 24 24"

                        height="16"

                        <circle cx="12" cy="12" r="5" />

                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />

            <div class="contact-hero">
                <div class="contact-hero-title">Contact</div>
            </div>

            <section class="contact-section">
                <form id="contact-form" novalidate>
                    <div class="form-field">
                        <label for="name">
                            Name
                            <span class="field-optional">(optional)</span>
                        </label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                        />
                    </div>
                    <div class="form-field">
                        <label for="email">
                            Email
                            <span class="field-optional">(optional)</span>
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-field">
                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="_subject"
                            required
                        />
                    </div>
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                        ></textarea>
                    </div>
                    <div class="form-field form-field--checkbox">
                        <input
                            type="checkbox"
                            id="wants_reply"
                            name="wants_reply"
                            value="Yes"
                        />
                        <label for="wants_reply">
                            I'd like a reply <span class="field-optional">(requires email above)</span>
                        </label>
                    </div>
                    <button type="submit" class="submit-btn">
                        Send Message
                    </button>
                    <div
                        id="form-status"
                        class="form-status"
                        aria-live="polite"
                    ></div>
                </form>
            </section>

                        target="_blank"

                        >Terry</a
                    >
                </p>
                <div class="footer-contact">
                    <a
                        href="https://github.com/chillbreeze/air-siem-reap"
                        target="_blank"
                    >
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
                            />
                        </svg>
                        GitHub
                    </a>
                    <span>|</span>
                    <a href="https://t.me/ProjectTerry" target="_blank">
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.32 14.347l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.828.212z"

                        Telegram

        </div>
        <script>
            document
                .getElementById("theme-toggle")
                .addEventListener("click", () => {
                    const isLight =
                        document.documentElement.getAttribute("data-theme") ===
                        "light";
                    if (isLight) {
                        document.documentElement.removeAttribute("data-theme");
                        localStorage.setItem("theme", "dark");
                    } else {
                        document.documentElement.setAttribute(
                            "data-theme",
                            "light",
                        );
                        localStorage.setItem("theme", "light");
                    }
                });

            const form = document.getElementById("contact-form");
            const status = document.getElementById("form-status");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const subject = form.querySelector("#subject");
                const message = form.querySelector("#message");
                const email = form.querySelector("#email");
                const wantsReply = form.querySelector("#wants_reply");
                if (wantsReply.checked && !email.value.trim()) {
                    status.textContent = "Please enter your email for a reply.";
                    status.className = "form-status form-status--error";
                    email.focus();
                    return;
                }
                if (!subject.value.trim()) {
                    status.textContent = "Please enter a subject.";
                    status.className = "form-status form-status--error";
                    subject.focus();
                    return;
                }
                if (!message.value.trim()) {
                    status.textContent = "Please enter a message.";
                    status.className = "form-status form-status--error";
                    message.focus();
                    return;
                }

                const btn = form.querySelector(".submit-btn");
                btn.disabled = true;
                btn.textContent = "Sending…";
                status.textContent = "";
                status.className = "form-status";

                try {
                    const res = await fetch(
                        "https://formspree.io/f/xgodgqkn",
                        {
                            method: "POST",
                            body: new FormData(form),
                            headers: { Accept: "application/json" },
                        },
                    );

                    if (res.ok) {
                        form.reset();
                        status.textContent =
                            "Message sent. Thanks for reaching out!";
                        status.className =
                            "form-status form-status--success";
                    } else {
                        const data = await res.json();
                        const msg =
                            data.errors
                                ? data.errors
                                      .map((err) => err.message)
                                      .join(", ")
                                : "Something went wrong. Please try again.";
                        status.textContent = msg;
                        status.className = "form-status form-status--error";
                    }
                } catch (_) {
                    status.textContent =
                        "Network error. Please check your connection and try again.";
                    status.className = "form-status form-status--error";
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Send Message";
                }
            });
        </script>
    </body>
