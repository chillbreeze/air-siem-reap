services:
  aqi-dashboard:
    build: ./app
    image: aqi-dashboard:local
    pull_policy: build
    container_name: aqi-dashboard
    network_mode: host
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - INFLUX_URL
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:5080/api/health')"
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/var/www/static:ro
    depends_on:
      - aqi-dashboard
networks: {}
