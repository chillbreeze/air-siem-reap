events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compress text files before sending (HTML is always included).
    # "proxied any" so it also applies to requests coming through the Cloudflare tunnel.
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;

        # Tell Nginx the real port is 443 (Cloudflare handles HTTPS)
        port_in_redirect off;

        # Static files are served straight from disk (./app/static is mounted here),
        # so they never reach Flask.
        # Fonts and Chart.js get a new filename whenever they change, so they can be cached for a long time.
        location /static/fonts/ {
            alias /var/www/static/fonts/;
            expires 30d;
        }
        location /static/js/ {
            alias /var/www/static/js/;
            expires 30d;
        }
        # CSS and images keep the same name when edited, so only cache them for an hour
        location /static/ {
            alias /var/www/static/;
            expires 1h;
        }
        location /images/ {
            alias /var/www/static/images/;
            expires 1h;
        }
        location = /favicon.ico {
            alias /var/www/static/images/favicon.ico;
            expires 1h;
        }

        # Dashboard - forward to Flask
        location / {
            proxy_pass http://127.0.0.1:5080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Blog - serve static files directly
        location /blog/ {
            alias /var/www/blog/;
            index index.html;
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
